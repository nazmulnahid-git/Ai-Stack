version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/apps/*', '/packages/*']
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.0 (docs/conventions.md §1.2)
      - dependency-name: typescript
        versions: ['>=6.1.0']
    commit-message:
      prefix: chore
      include: scope # → chore(deps): …

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope # → ci(deps): …
